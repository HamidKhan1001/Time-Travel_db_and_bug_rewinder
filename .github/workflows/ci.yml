name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # Rules and exclusions live in pyproject.toml. app/ and seed/ are excluded on purpose:
      # they hold the demo's intentionally buggy handler.
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: mypy

  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: Full unittest suite with coverage (floor in pyproject.toml)
        env:
          TT_PACE: "0"
        run: |
          coverage run tests/run_ci_suite.py --output "test-reports/ci-${{ matrix.python-version }}.json"
          coverage report

      - name: Guard unit and fuzz tests
        env:
          TT_PACE: "0"
        run: python -m unittest tests.test_guard tests.test_guard_fuzz -v

      - name: Isolated end-to-end demo
        env:
          TT_PACE: "0"
        run: python tests/e2e_isolated.py

      - name: Intent-parser evals (fails below the recorded baseline)
        run: python evals/run_evals.py --output "${{ runner.temp }}/evals.json"

      - name: Benchmark smoke test
        run: python benchmarks/benchmark_recovery.py --datasets 1000 --iterations 1 --output "${{ runner.temp }}/benchmark-smoke.json"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ matrix.python-version }}
          path: |
            test-reports/ci-${{ matrix.python-version }}.json
            ${{ runner.temp }}/evals.json
            ${{ runner.temp }}/benchmark-smoke.json
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Adapter unit tests
        run: npm test
      - name: Build (live mode, as served by server.py)
        run: npm run build:live

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Click through the real UI against the real server
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t time-travel-db:ci .
      - name: Start, wait for health, check non-root
        run: |
          docker run -d --name tt -p 127.0.0.1:8000:8000 -e TT_PACE=0 time-travel-db:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status": "ok"'
          curl -sf -o /dev/null http://127.0.0.1:8000/app/
          test "$(docker exec tt id -u)" != "0"
      - name: Logs on failure
        if: failure()
        run: docker logs tt

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python dependencies (project plus optional AI providers)
        run: |
          python -m pip install pip-audit -e ".[ai]"
          pip-audit --skip-editable
      - name: Frontend runtime dependencies (high or critical fails the build)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # One required check for branch protection: it fails if any job above failed, was cancelled or was skipped.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend, e2e, docker, security]
    if: always()
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required job did not succeed ($result)"; exit 1; }
          done

  # hamid_bot: see .github/workflows/hamid_bot.yml for the rules and setup.
  hamid_bot:
    name: hamid_bot
    needs: [quality-gate]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/hamid_bot.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
