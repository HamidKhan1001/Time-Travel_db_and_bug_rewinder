name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # Rules and exclusions live in pyproject.toml. app/ and seed/ are excluded on purpose:
      # they hold the demo's intentionally buggy handler.
      - run: ruff check .

  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt coverage

      - name: Full unittest suite with coverage (fails under 75%)
        env:
          TT_PACE: "0"
        run: |
          coverage run tests/run_ci_suite.py --output "test-reports/ci-${{ matrix.python-version }}.json"
          coverage report --fail-under=75

      - name: Guard unit and fuzz tests
        env:
          TT_PACE: "0"
        run: python -m unittest tests.test_guard tests.test_guard_fuzz -v

      - name: Isolated end-to-end demo
        env:
          TT_PACE: "0"
        run: python tests/e2e_isolated.py

      - name: Benchmark smoke test
        run: python benchmarks/benchmark_recovery.py --datasets 1000 --iterations 1 --output "${{ runner.temp }}/benchmark-smoke.json"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ matrix.python-version }}
          path: |
            test-reports/ci-${{ matrix.python-version }}.json
            ${{ runner.temp }}/benchmark-smoke.json
          if-no-files-found: warn

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Adapter unit tests
        run: npm test
      - name: Build (live mode, as served by server.py)
        run: npm run build:live

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python dependencies (optional AI providers)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Frontend runtime dependencies (high or critical fails the build)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # One required check for branch protection: it fails if any job above failed, was cancelled or was skipped.
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, security]
    if: always()
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required job did not succeed ($result)"; exit 1; }
          done

  # Approves the PR when the quality gate passed. This replaces a human only for low-risk changes:
  # it never approves forks, drafts, or PRs touching CI, the SQL guard, or dependency manifests.
  # Needs the repo setting: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
  auto-approve:
    name: Auto-approve
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve if the change is low-risk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "Changed files:"; echo "$files"
          protected=$(echo "$files" | grep -E '^(\.github/|timetravel/guard\.py$|requirements[^/]*\.txt$|pyproject\.toml$|frontend/package(-lock)?\.json$)' || true)
          if [ -n "$protected" ]; then
            echo "::notice::Needs a human review. Protected paths changed:"
            echo "$protected"
            exit 0
          fi
          gh pr review "$PR" --repo "$REPO" --approve \
            --body "Automated approval: lint, Python tests (coverage >= 75%), end-to-end demo, frontend tests and build, and dependency audits all passed. No protected paths were changed."
