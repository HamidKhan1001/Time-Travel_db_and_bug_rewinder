[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-travel-db"
version = "0.2.0"
description = "Point-in-time recovery for a corrupted database that keeps legitimate writes made after the crash, with an AI agent, a human approval gate and undo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# The core engine, server and tests use only the standard library and SQLite.
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=2.30.1"]
bedrock = ["boto3>=1.34.0"]
ai = ["google-genai>=2.30.1", "boto3>=1.34.0"]
dev = ["ruff>=0.6", "coverage>=7", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
time-travel-server = "server:main"

[tool.setuptools]
packages = ["timetravel", "timetravel.llm", "timetravel.recovery"]
py-modules = ["server", "reset"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
target-version = "py311"
# app/ and seed/ hold the intentionally buggy demo handler (the bug IS the demo), so they are not linted.
extend-exclude = ["app", "seed", "frontend", "data", "test-reports"]

[tool.ruff.lint]
# E9/F: syntax errors, undefined names, unused imports. I: sorted imports. B: bug-prone patterns (flake8-bugbear).
# SIM: needless complexity. C90: cyclomatic complexity cap, so new code cannot quietly grow another 40-branch function.
select = ["E9", "F", "I", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Known refactor candidates in the recovery engine and SQL guard (complexity 16-19). They are covered by tests
# and left alone on purpose; remove an entry when the function is split. Everything else must stay under the cap.
"timetravel/guard.py" = ["C901"]
"timetravel/recovery/dependencies.py" = ["C901"]
"timetravel/recovery/integrity.py" = ["C901"]
"timetravel/recovery/recovery_engine.py" = ["C901"]

[tool.coverage.run]
source = ["timetravel", "server.py"]
branch = true

[tool.coverage.report]
fail_under = 75

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["timetravel", "server.py"]
exclude = ["^app/", "^seed/", "^frontend/", "^tests/"]
